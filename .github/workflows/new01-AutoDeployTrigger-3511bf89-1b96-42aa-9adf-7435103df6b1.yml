name: Trigger auto deployment for new01

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ claude/requirements-intake-chatbot-ZVZG2 ]
    paths:
    - '**'
    - '.github/workflows/new01-AutoDeployTrigger-3511bf89-1b96-42aa-9adf-7435103df6b1.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NEW01_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NEW01_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NEW01_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 184a22edfbcc49279f2e13755be17b00.azurecr.io
          registryUsername: ${{ secrets.NEW01_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NEW01_REGISTRY_PASSWORD }}
          containerAppName: new01
          resourceGroup: dashboard-rg
          imageToBuild: 184a22edfbcc49279f2e13755be17b00.azurecr.io/new01:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


